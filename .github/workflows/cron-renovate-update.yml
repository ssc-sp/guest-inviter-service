name: Renovate Update Scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: renovate

    steps:
      - name: Create App token
        id: create_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INVITER_RENOVATE_APP_ID }}
          private-key: ${{ secrets.INVITER_RENOVATE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.create_token.outputs.token }}
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          configurationFile: renovate.json
          token: ${{ steps.create_token.outputs.token }}
          renovate-version: "43.288.0"
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PACKAGE_RULES: >-
            [
              {
                "matchPackageNames": [
                  "aquasecurity/setup-trivy",
                  "aquasecurity/trivy-action"
                ],
                "datasourceTemplate": "github-releases"
              }
            ]
          RENOVATE_HOST_RULES: >-
            [
              {
                "matchHost": "https://api.github.com/repos/aquasecurity/",
                "token": ""
              }
            ]
